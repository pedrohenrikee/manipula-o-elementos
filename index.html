<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
    <title>Criando Elemento HTML</title>
</head>
<body>
    <form>
        <input id="nome" type="text" placeholder="Digite um nome..." required>

        <input id="cargo" type="text" placeholder="Cargo" required>

        <input id="foto" type="file" placeholder="Insira uma imagem" accept="/image*">
        
        <button id="cadastrar" type="button">CADASTRAR</button>
    </form>
    <div class="container" id="container"></div>
</body>
</html>
